services:
  api:
    build: .
    container_name: job_import_api
    ports:
      - "${PORT}:${PORT}"
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
    restart: always

  redis:
    image: redis:7
    container_name: job_import_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: always
